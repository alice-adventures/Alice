name = "alice_tests"
version = "0.4.2-dev"
description = "Adventures for Learning and Inspiring Coding Excellence"
website = "https://github.com/alice-adventures/Alice/wiki"

authors = ["Francesc Rocher"]
maintainers = ["Francesc Rocher <francesc.rocher@gmail.com>"]
maintainers-logins = ["rocher"]

licenses = "MIT"
tags = [
   "alice",
   "adventures",
   "learning",
   "mathematics",
   "problems",
   "challenges",
]

project-files = [
   "project/alice_unit_test.gpr",
   "project/alice_integ_test.gpr",
   "project/alice_e2e_test.gpr",
]

[available.'case(os)']
'linux' = true
'...' = false

[configuration.variables]
Log_Level = { type = "Enum", values = [
   "Default", # warnings and errors
   "Verbose", # more detailed logs (info)
   "Trace",   # trace execution
   "Debug",   # debug information
], default = "Trace" }

[build-profiles]
# release, validation, development
"*" = "development"
"alice" = "development"

[build-switches."*"]
ada_version = ["-gnat2022", "-gnatX0", "-gnata"]

[[depends-on]]
alice = "*"
aunit = "^23.0.0"
gnat = ">=2021 | (>=12 & <2000)"
gnatcov = "^22.0.1"
simple_logging = "^1.2.0"

[[pins]]
alice = { path = '..' }
