name = "alice_tests"
version = "0.4.2-dev"
description = "Adventures for Learning and Inspiring Coding Excellence"
website = "https://github.com/alice-adventures/Alice/wiki"

authors = ["Francesc Rocher"]
maintainers = ["Francesc Rocher <francesc.rocher@gmail.com>"]
maintainers-logins = ["rocher"]

licenses = "MIT"
tags = [
   "alice",
   "adventures",
   "learning",
   "mathematics",
   "problems",
   "challenges",
]

project-files = [
   "project/alice_unit_test.gpr",
   "project/alice_integ_test.gpr",
   "project/alice_e2e_test.gpr",
]

[available.'case(os)']
'linux' = true
'...' = false

[configuration.variables]
Log_Level = { type = "Enum", values = [
   "Default", # warnings and errors
   "Verbose", # more detailed logs (info)
   "Trace",   # trace execution
   "Debug",   # debug information
], default = "Trace" }

[build-profiles]
# release, validation, development
"*" = "release"
"alice" = "validation"

[build-switches]
"*".Ada_Version = ["-gnat2022", "-gnatX0"]
"*".Contracts = "Yes"
"*".Source_Encoding = "utf_8"
"*".Style_Checks = "Yes"

"development".Compile_Checks = "Warnings"
"development".Debug_Info = "Yes"
"development".Optimization = "Debug"
"development".Runtime_Checks = "Everything"

"validation".Compile_Checks = "Errors"
"validation".Debug_Info = "Yes"
"validation".Optimization = "Debug"
"validation".Runtime_Checks = "Everything"

"release".Compile_Checks = "Errors"
"release".Debug_Info = "No"
"release".Optimization = "Performance"
"release".Runtime_Checks = "Default"

[[depends-on]]
alice = "*"
aunit = "^23.0.0"
gnat = ">=2021 | (>=12 & <15)"
gnatcov = "^22.0.1"
simple_logging = "^1.2.0"

[[pins]]
alice = { path = '..' }
